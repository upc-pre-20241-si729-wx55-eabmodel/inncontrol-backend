# Nombre de la aplicación
spring.application.name=inncontrol-backend

# Puerto dinámico proporcionado por Railway (8045 como fallback local)
server.port=${PORT:8045}

# Configuración de la base de datos (Railway MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.github.inncontrol.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Configuración de documentación OpenAPI
springdoc.api-docs.path=/v1/api-docs

# Configuración de Docker Compose (opcional, útil en local)
spring.docker.compose.lifecycle-management=start_and_stop

# Metadata desde pom.xml (opcional)
documentation.application.description=@project.description@
documentation.application.version=@project.version@

